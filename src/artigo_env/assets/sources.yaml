# Raw data sources of the corpus pipeline (SDD 06 §4, SDD 02 §B.8).
#
# Only sources in state "accepted" may enter a training build (REQ-COR-002). File paths are
# relative to ARTIGO_DATA_ROOT/raw/<raw_dir or id>/ and every file is pinned by SHA-256 and size
# (REQ-REPO-006). Quote every string that YAML could read as a date or a number.
#
# kind:   hf_parquet | jsonl_gz | wikipedia_extracts | demo
# state:  accepted | pending | rejected | stats-only | evaluation
# access: open | registration | request
# options: column mapping (title, body, url, date, id) and repo, subdir, raw_dir

version: 1

sources:
  - id: cc_news_pt
    kind: hf_parquet
    state: pending  # until the author accepts it (plan F3, "Decisões que dependem do autor")
    priority: 10
    url: "https://huggingface.co/datasets/eduagarcia/cc_news_pt"
    revision: "98c2d2ab1c43c232f51da9f56ea7f03e08636286"  # refs/convert/parquet
