      - path: "cc_news_pt/train/0003.parquet"
        sha256: "196692e04c55f0f13d4b1eaa38e75187525106ce9da4af7e6387adde16fc1e75"
        size: 287587858
      - path: "cc_news_pt/train/0022.parquet"
        sha256: "01180f6ad4e626f5140b9658899dd53f24ed8ecb74e2644616cf507cbb756e52"
        size: 289465694
      - path: "cc_news_pt/train/0045.parquet"
        sha256: "554ee3c0e8694e2fa7053f825598b4e0a75999fc5d4a252244b5078715001114"
        size: 284913880
    license_id: unknown
    license_note: "no licence on third-party text; internal research use; only code is redistributed"
    access: open
    redistributable: false
    terms: null
    variant: null
    options:
      repo: "eduagarcia/cc_news_pt"
      subdir: "cc_news_pt/train"
      title: "title"
      body: "text"
      url: "url"
      date: "date"

