[project]
name = "artigo-env"
version = "0.1.0"
description = "Gymnasium research platform that reproduces the artigo.app word-reveal game offline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Caio de Almeida Souza" }]
dependencies = [
    "numpy",
    "regex",
    "pyarrow",
    "xxhash",
    "pyyaml",
    "gymnasium==1.4.0",
]

[project.scripts]
artigo-env = "artigo_env.cli.main:main"

[project.optional-dependencies]
synthetic = ["httpx"]
# Needed only to download and build corpora (artigo-env data fetch/build), not to play.
data = ["ftfy", "huggingface_hub", "lxml"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "import-linter",
    "pre-commit",
    "filelock",
    "jsonschema",
    "types-regex",
    "types-PyYAML",
    "ftfy",
    "huggingface_hub",
    "hypothesis",
]
recorder = ["playwright"]
runner = ["hydra-core", "optuna"]
docs = ["mkdocs-material", "mkdocstrings[python]"]
# Runtime stack exercised by tools/smoke (LOCAL-ENV-1); moves into the package in F4.
smoke = ["gymnasium==1.4.0", "stable-baselines3", "sb3-contrib", "torch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artigo_env"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --junit-xml=local/reports/junit.xml"
markers = [
    "fast: quick tests that run in CI without network or real data",
    "slow: long-running tests executed locally",
    "local: tests that need local data under ARTIGO_DATA_ROOT",
    "perf: performance benchmarks with a recorded baseline",
    "req(*ids): SDD requirement or decision ids covered by the test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src", "tools"]
# tools/smoke needs the optional RL stack, which CI does not install.
exclude = ["docs/", "local/", "tools/smoke/"]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["artigo_env.core.*", "artigo_env.text.*", "artigo_env.engine.*"]
strict = true

# The recorder group is optional; CI type-checks without it.
[[tool.mypy.overrides]]
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "huggingface_hub", "huggingface_hub.*", "lxml", "lxml.*"]
ignore_missing_imports = true
