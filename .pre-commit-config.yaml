default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (layer contract)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: no-recordings
        name: recordings must not be committed
        entry: uv run python -m tools.repo.check_no_recordings
        language: system
      - id: no-game-tables
        name: game lemmatizer tables must not be committed
        entry: uv run python -m tools.repo.check_forbidden_tables
        language: system
        types: [text]
